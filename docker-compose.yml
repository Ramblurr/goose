services:
  redis:
    image: redis:7.0
    ports:
      - 6379:6379
  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:3.9.13-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - 5672:5672
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: goose_test
      POSTGRES_USER: goose
      POSTGRES_PASSWORD: goose
    ports:
      - 5432:5432
    command: postgres -c max_connections=200
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: goose_test
      MYSQL_USER: goose
      MYSQL_PASSWORD: goose
    ports:
      - 3306:3306
    command: --default-authentication-plugin=mysql_native_password --max-connections=200
